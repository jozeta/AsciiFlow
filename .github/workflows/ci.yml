name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check JavaScript
        run: for f in $(git ls-files 'js/*.js' 'tests/*.js'); do node --check "$f" || exit 1; done
      - name: Unit tests
        run: node --test tests/*.test.js
