name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Lint (ESLint, including the unsafe-DOM rule)
        run: npm run lint
      - name: Syntax-check JavaScript
        run: for f in $(git ls-files 'js/*.js' 'tests/*.js' 'tests/e2e/*.js'); do node --check "$f" || exit 1; done
      - name: Unit tests
        run: node --test tests/*.test.js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
