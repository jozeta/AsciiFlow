version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14

  # Test tooling only (Playwright, axe-core); the app itself has no dependencies.
  # Bootstrap is vendored in vendor/ and updated by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      test-tooling:
        patterns:
          - "*"
